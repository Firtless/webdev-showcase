<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ship Manager</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>

  <div class="container small-container">
    <header class="header">
      <h1 id="pageTitle">Create Ship</h1>
      <a href="home.html" class="btn btn-secondary">← Back to Catalog</a>
    </header>

    <form id="shipForm" novalidate>
      <input type="hidden" id="shipId">

      <div class="form-group">
        <label for="shipName">Ship Name</label>
        <input type="text" id="shipName" required placeholder="e.g. Poseidon">
      </div>

      <div class="form-group">
        <label for="shipTonnage">Tonnage</label>
        <input type="number" id="shipTonnage" min="1" step="any" required placeholder="e.g. 50000">
      </div>

      <div class="form-group">
        <label for="shipPassengers">Passenger Capacity</label>
        <input type="number" id="shipPassengers" min="0" step="1" required placeholder="e.g. 1200">
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary full-width">Save Ship</button>
    </form>
  </div>

  <div id="errorModal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>Validation Error</h3>
      <p id="modalErrorMessage">Please fill out all fields correctly.</p>
      <button id="closeModalBtn" class="btn btn-primary">OK</button>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="create.js"></script>
</body>
</html>
